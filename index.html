<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escudo Solar 3D</title>
  <meta name="description" content="Escudo circular de bronce 3D interactivo con materiales PBR (bronce, acero, madera y cuero), hecho para la web con model-viewer.">
  <link rel="stylesheet" href="css/styles.css">
  <!-- model-viewer 4.4.0 (Google) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="top">
    <h1>Escudo <span>Solar</span></h1>
    <p>Bronce, cuero, acero y madera · modelo 3D PBR interactivo</p>
  </header>

  <main>
    <section class="stage" aria-label="Visor 3D del escudo">
      <model-viewer id="shield"
        src="assets/shield.glb"
        alt="Escudo circular de bronce con radios, paneles oscuros de escamas, medallón solar y adornos curvos"
        camera-controls
        touch-action="pan-y"
        camera-orbit="0deg 85deg auto"
        min-camera-orbit="auto auto 0.8m"
        max-camera-orbit="auto auto 4m"
        interaction-prompt="auto"
        environment-image="neutral"
        shadow-intensity="1.1"
        shadow-softness="0.9"
        exposure="1.15"
        loading="eager">
        <div class="progress" slot="progress-bar"><div class="bar"></div></div>
      </model-viewer>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </section>

    <aside class="panel">
      <h2>Bronce y relieve</h2>
      <!-- Tres controles principales: modifican en tiempo real los materiales del GLB (ver js/app.js) -->
      <div class="actions">
        <button id="btn-clean" class="btn" aria-pressed="false" disabled>
          <b>Bronce limpio</b><span>Brillante, poco rugoso</span>
        </button>
        <button id="btn-aged" class="btn" aria-pressed="true" disabled>
          <b>Bronce envejecido</b><span>Pátina, suciedad, más rugoso</span>
        </button>
        <button id="btn-bump" class="btn" aria-pressed="true" disabled>
          <b>Relieve <span id="lbl-bump" class="inl">activado</span></b><span>Normal map del bronce y los paneles</span>
        </button>
      </div>

      <h2>Cámara</h2>
      <div class="cam">
        <button id="btn-rotate" class="btn small" aria-pressed="false">Auto-rotar</button>
        <button id="btn-reset" class="btn small">Reiniciar vista</button>
      </div>
      <p class="hint">Arrastra para orbitar · rueda o pellizco para zoom.</p>
    </aside>
  </main>

  <footer>Modelo y texturas propios · <a href="https://modelviewer.dev/" target="_blank" rel="noopener">model-viewer</a></footer>
  <script src="js/app.js"></script>
</body>
</html>
